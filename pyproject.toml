[project]
name = "gaitmap-datasets"
version = "0.16.0"
description = "Helper to access open-source gait datasets used by MaD-Lab"
readme = "README.rst"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Arne Küderle", email = "arne.kuederle@fau.de" },
    { name = "Nils Roth", email = "nils.roth@fau.de" },
    { name = "Liv Herzer", email = "liv.herzer@gmx.de" },
]
dependencies = [
    "tpcp>=3.0.0",
    "pandas>=3,<3.1",
    "numpy>=2.3.5,<3",
    "joblib>=1.5.2",
    "imucal>=2.3.0",
    "nilspodlib>=4.1.2",
    "scipy>=1.16.3",
    "c3d>=0.5.1",
    "h5py>=3.11.0",
    "pytz>=2024.1",
]

[project.urls]
Homepage = "https://github.com/mad-lab-fau/gaitmap-datasets"
Repository = "https://github.com/mad-lab-fau/gaitmap-datasets"

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "pytest>=8.4.2,<10",
    "pytest-cov>=7.0.0,<8",
    "numpydoc>=1.10.0,<2",
    "memory-profiler>=0.61.0,<0.62",
    "matplotlib>=3.9.0",
    "toml>=0.10.2,<0.11",
    "sphinx-gallery>=0.20.0,<1",
    "pydata-sphinx-theme>=0.16.1,<0.17",
    "ruff>=0.15.4",
    "sphinx>=8.2.3,<9",
    "myst-parser>=4.0.1,<5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "doc/sphinxext/*.py",
    "doc/build/*.py",
    "doc/temp/*.py",
    ".eggs/*.py",
    "examples",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "D",
    "UP",
    "N",
    "BLE",
    "YTT",
    "A",
    "C4",
    "T10",
    "EM",
    "ISC",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PD",
    "PGH",
    "B",
    "Q",
    "PL",
    "PIE",
    "TC",
    "TRY",
    "PTH",
    "RUF",
    "NPY",
    "INP",
    "TID252",
    "FLY",
]
ignore = [
    "B006",
    "B008",
    "B010",
    "PLR2004",
    "EM101",
    "EM102",
    "EM103",
    "D213",
    "RET504",
    "TRY301",
    "TC001",
    "TC002",
    "TC003",
    "PD013",
    "TRY003",
    "PLR0913",
    "A003",
    "ISC001",
    "B028",
    "PLW2901",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.poe.tasks]
_format = "ruff format src/gaitmap_datasets tests _tasks.py docs/__init__.py docs/conf.py docs/sphinxext"
_auto_fix = "ruff check src/gaitmap_datasets tests _tasks.py docs/__init__.py docs/conf.py docs/sphinxext --fix-only --show-fixes --exit-zero"
format = ["_auto_fix", "_format"]
lint = { cmd = "ruff check src/gaitmap_datasets", help = "Lint all files with ruff." }
_lint_ci = "ruff check src/gaitmap_datasets --output-format=github"
_check_format = "ruff format src/gaitmap_datasets tests _tasks.py docs/__init__.py docs/conf.py docs/sphinxext --check"
ci_check = { sequence = ["_check_format", "_lint_ci"], help = "Check all potential format and linting issues." }
test_ci = { cmd = "pytest tests/test_config.py tests/test_download.py tests/test_egait_loading.py tests/test_egait_loader_compatibility.py tests/test_kluge_loader_compatibility.py", help = "Run dataset-free tests used in CI." }
test = { cmd = "pytest --cov=gaitmap_datasets --cov-report=term-missing --cov-report=xml", help = "Run Pytest with coverage." }
version = { script = "_tasks:task_update_version()", help = "Bump version in all relevant places." }
docs = { script = "_tasks:task_docs()", help = "Build the html docs using Sphinx." }
upload_docs = { script = "_tasks:task_upload_docs()", help = "Upload the built docs to the gh-pages branch." }
prepare_release = { script = "_tasks:task_prepare_release()", help = "Build docs, upload them, and prepare the release commit." }
create_dev_config = { script = "gaitmap_datasets:create_config_template('.datasets.dev.json')", help = "Create a local dataset config template for development." }

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
