name: Test and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Testing
        run: uv run poe test_ci

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install lowest direct dependencies
        run: uv sync --resolution lowest-direct --upgrade --group dev
      - name: Test with minimum dependencies
        run: uv run --frozen poe -e simple test_ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Linting
        run: uv run poe ci_check
